<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1050px;margin:auto;min-height:100vh;padding:22px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:15px;background:var(--green2);display:grid;place-items:center;font-size:22px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.brand h1{font-size:20px;margin:2px 0 0;letter-spacing:.02em}.topnote{font-size:12px;color:var(--muted);text-align:right}.hero{background:var(--paper);border:1px solid var(--line);border-radius:25px;padding:24px;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}.hero:after{content:'✿';position:absolute;right:22px;top:8px;font-size:82px;color:var(--green2);transform:rotate(14deg)}.hero .eyebrow{font-size:11px}.hero h2{font-size:26px;line-height:1.35;margin:9px 0 7px;max-width:520px}.hero p{font-size:13px;line-height:1.7;color:var(--muted);max-width:500px;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:16px}.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:25px;font-weight:700;margin-top:8px}.stat small{font-size:11px;color:var(--muted);font-weight:400}.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 15px;margin-bottom:4px;scrollbar-width:none}.nav button{white-space:nowrap;border:1px solid var(--line);background:var(--paper);color:var(--muted);padding:11px 15px;border-radius:999px;font-size:13px}.nav button.active{background:var(--ink);border-color:var(--ink);color:#fff}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 15px}.section-head h2{font-size:21px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.btn{border:0;border-radius:12px;background:var(--ink);color:white;padding:11px 15px;font-size:13px}.btn.light{background:var(--green2);color:var(--ink)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);min-width:0}.toolbar input{flex:1;min-width:140px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.photo{height:155px;background:linear-gradient(135deg,#e8eddf,#f8f4e9);display:grid;place-items:center;color:#8c9b83;font-size:35px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.cardbody{padding:13px}.tag{display:inline-block;background:var(--green2);border-radius:7px;padding:4px 7px;font-size:10px;color:#536b50;margin:0 4px 6px 0}.card h3{font-size:14px;margin:2px 0 6px;line-height:1.45}.sub{font-size:11px;color:var(--muted);line-height:1.5}.price{font-weight:700;font-size:14px;margin-top:9px}.cardactions{display:flex;gap:6px;margin-top:11px}.cardactions button{font-size:11px;padding:7px 9px;border-radius:9px}.empty{border:1px dashed #cdd5c5;border-radius:18px;padding:36px 18px;text-align:center;color:var(--muted);background:#ffffff5c}.empty .emoji{font-size:30px;margin-bottom:8px}.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}.list{display:grid;gap:10px}.row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px}.rowicon{width:42px;height:42px;border-radius:13px;background:var(--green2);display:grid;place-items:center;font-size:20px;flex-shrink:0}.rowmain{flex:1;min-width:0}.rowmain strong{display:block;font-size:13px;overflow-wrap:anywhere}.rowmain span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.rowprice{font-weight:700;font-size:13px;text-align:right}.row button{border:0;background:transparent;color:var(--muted);padding:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fffefb;border-radius:11px;padding:11px;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.modalback{position:fixed;inset:0;background:#1e292266;display:none;align-items:flex-end;justify-content:center;padding:15px;z-index:10}.modalback.show{display:flex}.modal{background:var(--bg);border-radius:24px 24px 18px 18px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0002}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{font-size:19px;margin:0}.x{border:0;background:var(--green2);border-radius:50%;width:32px;height:32px;font-size:18px}.formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}.backupbox{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}.backupbox h3{font-size:15px;margin:0 0 7px}.backupbox p{font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 13px}.settingrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.settingrow select{border:1px solid var(--line);border-radius:10px;padding:8px;background:white}.footnote{text-align:center;font-size:11px;color:var(--muted);margin-top:28px;line-height:1.7}.hidden{display:none!important}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:11px 17px;font-size:12px;z-index:20;box-shadow:var(--shadow);max-width:90vw;text-align:center}.dashboardgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:17px}.panel h3{font-size:14px;margin:0 0 12px}.minirow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.minirow:last-child{border:0}.minirow span:last-child{color:var(--muted);text-align:right}.theme-options{display:flex;gap:8px;flex-wrap:wrap}.themechip{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--ink)}.themechip.active{outline:2px solid var(--green)}.row .field input{min-width:0}.row .field{gap:4px}.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.analytics-panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}.analytics-panel h3{font-size:14px;margin:0 0 10px}.analytics-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.analytics-row:last-child{border-bottom:0}.analytics-row span:last-child{text-align:right;font-weight:650}.pie-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.pie{width:148px;height:148px;border-radius:50%;flex:0 0 148px;background:conic-gradient(#e6e7dc 0deg 360deg);position:relative}.pie:after{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--paper)}.pie-legend{flex:1;min-width:120px;display:grid;gap:8px}.legend-item{display:flex;align-items:center;gap:7px;font-size:11px}.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}.analytics-select{border:1px solid var(--line);border-radius:10px;padding:7px;background:var(--paper);color:var(--ink);font:inherit;font-size:12px;margin-left:6px}.year-compare{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px}.year-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.year-controls label{font-size:12px;color:var(--muted)}.year-controls select{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fffefb;color:var(--ink);margin-left:5px}.year-totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.year-total{border-radius:14px;background:var(--green2);padding:12px}.year-total .yr{font-size:11px;color:var(--muted)}.year-total strong{display:block;font-size:19px;margin-top:5px}.year-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.year-subpanel{border-top:1px solid var(--line);padding-top:12px;min-width:0}.year-subpanel h4{font-size:13px;margin:0 0 7px}.year-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}.year-row:last-child{border-bottom:0}.year-row .yrval{text-align:right;white-space:nowrap}.year-row .delta{color:var(--muted);text-align:right;white-space:nowrap}.year-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px}@media(max-width:650px){.year-columns{grid-template-columns:1fr}.year-row{grid-template-columns:minmax(0,1fr) auto auto;font-size:10px}.year-total strong{font-size:16px}}@media(max-width:650px){.analytics-grid{grid-template-columns:1fr}.pie-wrap{justify-content:center}.pie-legend{min-width:140px}}
@media(max-width:650px){.app{padding:16px 13px 90px}.hero{padding:20px}.hero h2{font-size:23px}.stats{gap:8px}.stat{padding:12px}.stat .num{font-size:21px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:135px}.cardbody{padding:11px}.dashboardgrid{grid-template-columns:1fr}.topnote{font-size:10px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.section-head h2{font-size:19px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">🌿</div><div><div class="eyebrow">MY OSHIKATSU JOURNAL</div><h1>Oshi Log <span style="font-size:12px;color:var(--muted);font-weight:400">｜推活圖鑑</span></h1></div></div><div class="topnote">my little archive<br>好きの記録を、ひとつずつ。</div></header>
<div id="homeHero" class="hero"><div class="eyebrow">A LITTLE JOY, EVERY DAY</div><h2>把喜歡的事，<br>好好收藏起來。 ✿</h2><p>你的私人推活手帳。收藏、花費、參戰回憶，都在這裡慢慢累積。</p></div>
<div class="stats"><div class="stat"><div class="label">📦 收藏商品</div><div class="num" id="statGoods">0 <small>件</small></div></div><div class="stat"><div class="label">💰 累積支出</div><div class="num" id="statSpend">¥0</div></div><div class="stat"><div class="label">🎤 參戰場次</div><div class="num" id="statEvents">0 <small>場</small></div></div></div>
<nav class="nav"><button class="active" data-page="home">⌂ 總覽</button><button data-page="goods">▦ 周邊圖鑑</button><button data-page="events">♫ 參戰紀錄</button><button data-page="expenses">￥ 收支</button><button data-page="backup">⚙ 設定</button></nav>
<main id="page"></main><div class="footnote">Oshi Log · personal prototype<br>資料目前只保存在這個瀏覽器的本機空間，請定期匯出備份。照片會包含在完整備份中。</div>
</div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">新增</h2><button class="x" id="closeModal">×</button></div><form id="modalForm"><div id="modalFields" class="formgrid"></div><div class="formfoot"><button type="button" class="btn outline" id="cancelModal">取消</button><button type="submit" class="btn">儲存</button></div></form></div></div><div id="toast" class="toast hidden"></div>
<script>
const DB_NAME='oshi-log-db', DB_VERSION=1; let db; let page='home'; let expenseView='records'; let editId=null; let formType=null; let currentImage=''; let currentEventImages=[];
const stores=['goods','expenses','events','settings'];
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;for(const s of stores){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});}};r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((resolve,reject)=>{const r=db.transaction(store,'readonly').objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function put(store,item){return new Promise((resolve,reject)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(item);r.onsuccess=()=>resolve(item);r.onerror=()=>reject(r.error)})}
function remove(store,id){return new Promise((resolve,reject)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
function currencyCode(x){return x.currency==='HKD'?'HKD':'JPY'}
function money(n,c='JPY'){return new Intl.NumberFormat(c==='HKD'?'zh-HK':'ja-JP',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(n)||0)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'short',day:'numeric'}):'未設定日期'}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function currencyTotals(items,amountKey){const totals={JPY:0,HKD:0};items.forEach(x=>totals[currencyCode(x)]+=Number(x[amountKey]||0));return totals}
function totalsText(items,amountKey){const t=currencyTotals(items,amountKey);const bits=[];if(t.JPY)bits.push(money(t.JPY,'JPY'));if(t.HKD)bits.push(money(t.HKD,'HKD'));return bits.join(' · ')||'¥0'}
async function refreshStats(){const [g,e,v]=await Promise.all([all('goods'),all('expenses'),all('events')]);document.getElementById('statGoods').innerHTML=`${g.filter(x=>x.status==='已入手').length} <small>件</small>`;document.getElementById('statSpend').textContent=totalsText(e,'amount');document.getElementById('statEvents').innerHTML=`${v.length} <small>場</small>`}
function empty(icon,title,desc){return `<div class="empty"><div class="emoji">${icon}</div><strong>${title}</strong><div>${desc}</div></div>`}
function sectionHead(title,desc,button,label){return `<div class="section-head"><div><h2>${title}</h2><p>${desc}</p></div>${button?`<button class="btn" data-action="${button}">＋ ${label}</button>`:''}</div>`}
function groupOptions(records){const groups=[...new Set(records.map(x=>x.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b));return `<option value="全部">全部グループ</option>${groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}`}
function groupFilter(records,id){return `<select id="${id}">${groupOptions(records)}</select>`}
const DEFAULT_GOODS_CATEGORIES=['うちわ','アクスタ','公式寫真','ぬいぐるみ','CD／Blu-ray','場刊','Tour Goods','其他'];
async function getGoodsCategories(){const setting=(await all('settings')).find(x=>x.id==='goodsCategories');return [...new Set((setting?.items||DEFAULT_GOODS_CATEGORIES).filter(Boolean))];}
async function saveGoodsCategories(items){await put('settings',{id:'goodsCategories',items:[...new Set(items.map(x=>x.trim()).filter(Boolean))]});}
function eventTypeOptions(){return ['ライブ／演唱會','舞台／舞台劇','Online／線上活動','ライブビューイング','其他'];}
async function render(){await refreshStats();const root=document.getElementById('page');if(page==='home'){const [g,e,v]=await Promise.all([all('goods'),all('expenses'),all('events')]);const recent=[...g].sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,4);root.innerHTML=`${sectionHead('推活總覽','今天也好好收藏喜歡的事。','add-goods','新增周邊')}<div class="dashboardgrid"><div class="panel"><h3>🌱 最近收藏</h3>${recent.length?recent.map(x=>`<div class="minirow"><span>${esc(x.name)}</span><span>${esc([x.group,x.member||x.category].filter(Boolean).join(' · ')||'未分類')}</span></div>`).join(''):`<div class="sub">你的第一件收藏，等你來記錄。</div>`}<div style="margin-top:13px"><button class="btn light" data-page="goods">打開周邊圖鑑 →</button></div></div><div class="panel"><h3>✧ 推活小日記</h3><div class="minirow"><span>本次收藏總數</span><span>${g.filter(x=>x.status==='已入手').length} 件</span></div><div class="minirow"><span>支出記錄</span><span>${e.length} 筆</span></div><div class="minirow"><span>參戰紀錄</span><span>${v.length} 場</span></div><div class="minirow"><span>累積支出</span><span>${esc(totalsText(e,'amount'))}</span></div><p class="sub" style="margin:12px 0 0">小提醒：記得定期到「備份・設定」匯出資料，照片亦會一併打包。</p></div></div><div style="margin-top:24px">${sectionHead('快速記錄','把剛剛發生的推活小事記下來。','','')}<div class="toolbar"><button class="btn light" data-action="add-goods">📦 新增周邊</button><button class="btn light" data-action="add-expense">💰 記一筆支出</button><button class="btn light" data-action="add-event">🎤 新增參戰</button></div></div>`;
}else if(page==='goods'){const g=await all('goods');const categories=await getGoodsCategories();root.innerHTML=`${sectionHead('周邊圖鑑','商品支出會自動連結到收支記錄，不用重複輸入。','add-goods','新增周邊')}<div class="toolbar"><input id="goodsSearch" placeholder="搜尋商品、成員、年份……"><select id="goodsFilter"><option value="全部">全部狀態</option><option>已入手</option><option>預訂中</option><option>想入手</option></select>${groupFilter(g,'goodsGroupFilter')}<select id="goodsCategoryFilter"><option value="全部">全部種類</option>${[...new Set([...categories,...g.map(x=>x.category).filter(Boolean)])].map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select><select id="goodsSort"><option value="new">最近新增</option><option value="old">最早新增</option><option value="price">價格高至低</option></select></div><div id="goodsGrid" class="grid"></div>`;renderGoods(g);
}else if(page==='expenses'){const e=(await all('expenses')).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const allGoods=await all('goods');const subnav=`<div class="nav" style="padding-top:0"><button data-expense-view="records" class="${expenseView==='records'?'active':''}">💳 收支記錄</button><button data-expense-view="analysis" class="${expenseView==='analysis'?'active':''}">📊 支出分析</button></div>`;if(expenseView==='records'){root.innerHTML=`${sectionHead('收支記錄','只保留記錄及搜尋，分析圖表已獨立放到「支出分析」。','add-expense','新增支出')}${subnav}<div class="panel" style="margin-bottom:14px"><div class="sub">已記錄支出總額（按幣別分開，不混算）</div><div style="font-size:22px;font-weight:700;margin-top:5px">${esc(totalsText(e,'amount'))}</div><div class="sub" style="margin-top:6px">目前 ${e.length} 筆記錄 · ${e.filter(x=>x.linkedGoodsId).length} 筆連結周邊</div></div><div class="toolbar"><input id="expenseSearch" placeholder="搜尋項目、分類、グループ……"><select id="expenseMonth"><option value="">所有月份</option>${[...new Set(e.map(x=>(x.date||'').slice(0,7)).filter(Boolean))].sort().reverse().map(m=>`<option>${m}</option>`).join('')}</select>${groupFilter(e,'expenseGroupFilter')}</div><div id="expenseList" class="list">${expenseRows(e)}</div>`;}else{root.innerHTML=`${sectionHead('支出分析','把年度比較、團體支出及週邊種類比例集中在這裡。','','')}${subnav}<section class="year-compare"><div class="section-head" style="margin-top:0"><div><h2 style="font-size:17px">📅 年度推活支出比較</h2><p>比較不同年份的總支出、各グループ及周邊種類消費。</p></div></div><div class="year-controls"><label>比較年份<select id="yearA" class="analytics-select"></select></label><label>對比年份<select id="yearB" class="analytics-select"></select></label><label>幣別<select id="yearCurrency" class="analytics-select"><option value="JPY">JPY ¥</option><option value="HKD">HKD $</option></select></label></div><div id="yearComparison"></div></section><div class="analytics-grid"><section class="analytics-panel"><h3>🗂️ 各グループ支出總額</h3><div id="groupTotals"></div></section><section class="analytics-panel"><h3>📦 各種類週邊支出</h3><div id="goodsCategoryTotals"></div></section><section class="analytics-panel" style="grid-column:1/-1"><h3>🍰 週邊種類支出比例 <label style="font-weight:400">幣別<select id="pieCurrency" class="analytics-select"><option value="JPY">JPY ¥</option><option value="HKD">HKD $</option></select></label></h3><div id="goodsPie"></div></section></div>`;renderExpenseAnalytics(e,allGoods);renderYearComparison(e,allGoods);}

function renderYearComparison(expenses,goods){
 const root=document.getElementById('yearComparison');if(!root)return;
 const yearsSet=new Set([String(new Date().getFullYear()),String(new Date().getFullYear()-1)]);
 expenses.forEach(x=>{if(x.date&&/^\d{4}/.test(x.date))yearsSet.add(x.date.slice(0,4))});
 goods.forEach(x=>{if(x.date&&/^\d{4}/.test(x.date))yearsSet.add(x.date.slice(0,4))});
 const years=[...yearsSet].sort((a,b)=>Number(b)-Number(a));
 const selA=document.getElementById('yearA'),selB=document.getElementById('yearB');
 const oldA=selA.value,oldB=selB.value;
 const opts=years.map(y=>`<option value="${y}">${y}</option>`).join('');
 if(!selA.options.length)selA.innerHTML=opts;else if(selA.options.length!==years.length||years.some(y=>![...selA.options].some(o=>o.value===y)))selA.innerHTML=opts;
 if(!selB.options.length)selB.innerHTML=opts;else if(selB.options.length!==years.length||years.some(y=>![...selB.options].some(o=>o.value===y)))selB.innerHTML=opts;
 if(oldA&&years.includes(oldA))selA.value=oldA;else selA.value=years[0]||String(new Date().getFullYear());
 if(oldB&&years.includes(oldB))selB.value=oldB;else selB.value=years[1]||String(Number(selA.value)-1);
 const ya=selA.value,yb=selB.value,currency=document.getElementById('yearCurrency').value||'JPY';
 const yearItems=y=>expenses.filter(x=>(x.date||'').slice(0,4)===y&&currencyCode(x)===currency);
 const ea=yearItems(ya),eb=yearItems(yb);const sum=arr=>arr.reduce((n,x)=>n+(Number(x.amount)||0),0);
 const totalA=sum(ea),totalB=sum(eb);const delta=totalA-totalB;const fmt=n=>money(n,currency);
 const goodsById=new Map(goods.map(g=>[g.id,g]));
 function breakdown(items,type){const m=new Map();items.forEach(x=>{let key;if(type==='group')key=x.group||'未分類';else{if(!x.linkedGoodsId||!goodsById.has(x.linkedGoodsId))return;key=goodsById.get(x.linkedGoodsId).category||'其他'}m.set(key,(m.get(key)||0)+(Number(x.amount)||0))});return m}
 const ga=breakdown(ea,'group'),gb=breakdown(eb,'group'),ca=breakdown(ea,'category'),cb=breakdown(eb,'category');
 function rows(ma,mb){const keys=[...new Set([...ma.keys(),...mb.keys()])].sort((a,b)=>a.localeCompare(b));if(!keys.length)return '<div class="sub">暫時沒有可比較的記錄。</div>';return keys.sort((a,b)=>((mb.get(b)||0)-(ma.get(b)||0))-((mb.get(a)||0)-(ma.get(a)||0))).map(k=>{const a=ma.get(k)||0,b=mb.get(k)||0,d=a-b;return `<div class="year-row"><span>${esc(k)}</span><span class="yrval"><span class="sub">${esc(ya)}</span><br><strong>${esc(fmt(a))}</strong><br><span class="sub">${esc(yb)} ${esc(fmt(b))}</span></span><span class="delta">差額<br><strong>${d>0?'+':''}${esc(fmt(d))}</strong></span></div>`}).join('')}
 root.innerHTML=`<div class="year-totals"><div class="year-total"><div class="yr">${esc(ya)} 年總支出</div><strong>${esc(fmt(totalA))}</strong><div class="sub">${ea.length} 筆支出</div></div><div class="year-total"><div class="yr">${esc(yb)} 年總支出</div><strong>${esc(fmt(totalB))}</strong><div class="sub">${eb.length} 筆支出</div></div></div><div class="sub" style="margin-bottom:12px">年度差額（${esc(ya)} − ${esc(yb)}）：<strong>${delta>0?'+':''}${esc(fmt(delta))}</strong></div><div class="year-columns"><div class="year-subpanel"><h4>🗂️ 各グループ支出</h4>${rows(ga,gb)}</div><div class="year-subpanel"><h4>📦 各種類周邊支出</h4>${rows(ca,cb)}<div class="year-note">種類統計只計算已連結到周邊圖鑑的購入記錄；グループ統計則計算該年度所有支出。</div></div></div>`;
}
function drawGoodsPie(expenses,goods){
 const root=document.getElementById('goodsPie');if(!root)return;const currency=document.getElementById('pieCurrency')?.value||'JPY';const goodsById=new Map(goods.map(x=>[x.id,x]));const totals=new Map();expenses.filter(x=>x.linkedGoodsId&&goodsById.has(x.linkedGoodsId)&&currencyCode(x)===currency).forEach(x=>{const cat=goodsById.get(x.linkedGoodsId).category||'其他';totals.set(cat,(totals.get(cat)||0)+Number(x.amount||0))});const entries=[...totals.entries()].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const sum=entries.reduce((n,x)=>n+x[1],0);if(!entries.length||sum<=0){root.innerHTML=`<div class="sub">目前沒有 ${currency} 的周邊支出可以繪製比例圖。</div>`;return}const colors=['#8da68b','#d9b58c','#8baebd','#c78f9b','#a89bc7','#d6c96c','#7fa99c','#d98d72','#aab3bd','#b9c8a6'];let start=0;const stops=entries.map(([name,value],i)=>{const end=start+value/sum*360;const stop=`${colors[i%colors.length]} ${start}deg ${end}deg`;start=end;return stop}).join(',');root.innerHTML=`<div class="pie-wrap"><div class="pie" role="img" aria-label="周邊種類支出比例圖" style="background:conic-gradient(${stops})"></div><div class="pie-legend">${entries.map(([name,value],i)=>`<div class="legend-item"><span class="legend-dot" style="background:${colors[i%colors.length]}"></span><span style="flex:1">${esc(name)} · ${(value/sum*100).toFixed(1)}%</span><strong>${esc(money(value,currency))}</strong></div>`).join('')}<div class="sub">合計 ${esc(money(sum,currency))} · 只計入已連結到周邊圖鑑的支出</div></div></div>`;

function currencyField(value){return field('currency','幣別','select',{value:value||'JPY',options:['JPY','HKD']})}
async function openForm(type,id=null){formType=type;editId=id;currentImage='';currentEventImages=[];let data={};if(id)data=(await all(type)).find(x=>x.id===id)||{};const goodsCategories=await getGoodsCategories();document.getElementById('modalTitle').textContent=(id?'編輯':'新增')+({goods:'周邊',expenses:'支出',events:'參戰'}[type]);let f='';if(type==='goods'){currentImage=data.image||'';f=field('name','商品名稱 *','text',{value:data.name||'',placeholder:'例如：アクリルスタンド'})+field('group','グループ','text',{value:data.group||'Snow Man',placeholder:'例如：Snow Man、嵐、Hey! Say! JUMP'})+field('member','成員','text',{value:data.member||'',placeholder:'例如：目黒蓮／阿部亮平'})+field('category','商品種類','select',{value:data.category||'其他',options:goodsCategories})+field('status','收藏狀態','select',{value:data.status||'已入手',options:['已入手','預訂中','想入手']})+field('year','年份','number',{value:data.year||new Date().getFullYear()})+field('event','相關活動／Tour','text',{value:data.event||'',placeholder:'例如：ON'})+field('price','購入價格','number',{value:data.price??'',placeholder:'0',step:'0.01'})+currencyField(data.currency)+field('date','購入日期','date',{value:data.date||today()})+field('image','商品照片','file',{full:true})+field('note','備註','textarea',{value:data.note||'',full:true,placeholder:'存放位置、版本、特別回憶……'})+(data.linkedExpenseId?`<div class="field full"><label>支出連結</label><div class="sub">已連結到收支記錄；儲存時會同步更新金額、日期、幣別及グループ。</div></div>`:'<div class="field full"><label>支出連結</label><div class="sub">儲存周邊時會自動建立一筆收支記錄，毋須重複輸入。</div></div>');}else if(type==='expenses'){f=field('name','項目名稱 *','text',{value:data.name||'',placeholder:'例如：演唱會門票'})+field('amount','金額 *','number',{value:data.amount??'',placeholder:'0',step:'0.01'})+currencyField(data.currency)+field('group','グループ','text',{value:data.group||'',placeholder:'例如：Snow Man、嵐'})+field('category','支出分類','select',{value:data.category||'周邊',options:['周邊','門票','交通','住宿','餐飲','CD／影音','代購／運費','其他']})+field('date','日期','date',{value:data.date||today()})+field('note','備註','textarea',{value:data.note||'',full:true,placeholder:'購買渠道、活動名稱等'});if(data.linkedGoodsId)f+=`<div class="field full"><label>連結商品</label><div class="sub">呢筆支出由周邊圖鑑管理，請到該件周邊編輯金額或刪除。</div></div>`;}else{currentEventImages=data.photos||[];f=field('name','活動名稱 *','text',{value:data.name||'',placeholder:'例如：Snow Man LIVE TOUR'})+field('eventType','活動形式','select',{value:data.eventType||'ライブ／演唱會',options:eventTypeOptions()})+field('group','グループ','text',{value:data.group||'Snow Man',placeholder:'例如：Snow Man、嵐、個人活動'})+field('members','參戰成員（用逗號分隔）','text',{value:(data.members||[]).join(', '),placeholder:'例如：目黒蓮, 阿部亮平'})+field('date','參戰日期','date',{value:data.date||today()})+field('venue','會場','text',{value:data.venue||'',placeholder:'會場名稱／城市'})+field('seat','座位／場次','text',{value:data.seat||'',placeholder:'例如：Day 1、アリーナ'})+field('ticket','門票價格','number',{value:data.ticket??'',placeholder:'0',step:'0.01'})+currencyField(data.currency)+field('photos','參戰照片（可多選）','file',{full:true,multiple:true})+(currentEventImages.length?`<div class="field full"><label>已保存照片（${currentEventImages.length} 張）</label><div style="display:flex;gap:6px;flex-wrap:wrap">${currentEventImages.map((src,i)=>`<label style="display:flex;align-items:center;gap:4px;font-size:11px"><img src="${src}" style="width:54px;height:54px;object-fit:cover;border-radius:8px"><input type="checkbox" name="removePhoto" value="${i}">移除</label>`).join('')}</div></div>`:'')+field('memo','當日回憶','textarea',{value:data.memo||'',full:true,placeholder:'同行的人、最難忘的瞬間、當日心情……'});}
document.getElementById('modalFields').innerHTML=f;document.getElementById('modalback').classList.add('show')}
function closeForm(){document.getElementById('modalback').classList.remove('show');document.getElementById('modalForm').reset();editId=null;formType=null;currentImage='';currentEventImages=[]}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
document.getElementById('modalForm').addEventListener('submit',async ev=>{ev.preventDefault();const form=ev.currentTarget,fd=new FormData(form),data={};for(const [k,v] of fd.entries()){if(k==='image'||k==='photos'||k==='removePhoto')continue;data[k]=v}if(!data.name?.trim()){toast('請先填寫名稱');return}if(formType==='goods'){const file=fd.get('image');if(file&&file.size){if(file.size>6*1024*1024){toast('照片太大，請選擇 6MB 以下的圖片');return}currentImage=await fileToData(file)}data.image=currentImage||'';data.price=Number(data.price)||0;data.year=data.year?Number(data.year):'';data.currency=data.currency||'JPY';data.group=(data.group||'').trim();}if(formType==='expenses'){data.amount=Number(data.amount)||0;data.currency=data.currency||'JPY';data.group=(data.group||'').trim()}if(formType==='events'){const files=[...(fd.getAll('photos')||[])].filter(f=>f&&f.size);for(const file of files){if(file.size>6*1024*1024){toast('每張照片請選擇 6MB 以下的圖片');return}}const removed=new Set(fd.getAll('removePhoto').map(Number));currentEventImages=currentEventImages.filter((_,i)=>!removed.has(i));const added=await Promise.all(files.map(fileToData));data.photos=[...currentEventImages,...added];data.members=(data.members||'').split(/[,，、]/).map(s=>s.trim()).filter(Boolean);data.ticket=Number(data.ticket)||0;data.currency=data.currency||'JPY';data.group=(data.group||'').trim()}const existing=editId?(await all(formType)).find(x=>x.id===editId):null;data.id=editId||uid();data.created=existing?.created||new Date().toISOString();
if(formType==='goods'){const shouldHaveExpense=Number(data.price)>0&&data.status!=='想入手';if(shouldHaveExpense||existing?.linkedExpenseId){const expenseId=existing?.linkedExpenseId||uid();data.linkedExpenseId=expenseId;const expense={id:expenseId,name:data.name,amount:data.price,currency:data.currency,category:'周邊',date:data.date,group:data.group,note:`由周邊圖鑑連結${data.member?' · '+data.member:''}${data.event?' · '+data.event:''}`,linkedGoodsId:data.id,created:existing?.created||new Date().toISOString()};await put('expenses',expense)}else{delete data.linkedExpenseId}}
await put(formType,data);closeForm();await render();toast(formType==='goods'?'已儲存周邊，支出亦已同步 🌿':'已儲存，推活記錄＋1 🌿')});
document.getElementById('closeModal').onclick=closeForm;document.getElementById('cancelModal').onclick=closeForm;document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeForm()});
document.addEventListener('click',async e=>{const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));await render();return}const a=e.target.closest('[data-action]');if(a){const t={'add-goods':'goods','add-expense':'expenses','add-event':'events'}[a.dataset.action];if(t)openForm(t);return}const ed=e.target.closest('[data-edit]');if(ed){openForm(ed.dataset.edit,ed.dataset.id);return}const del=e.target.closest('[data-delete]');if(del){if(confirm('確定刪除呢筆記錄？')){const store=del.dataset.delete,id=del.dataset.id;if(store==='goods'){const item=(await all('goods')).find(x=>x.id===id);if(item?.linkedExpenseId)await remove('expenses',item.linkedExpenseId)}await remove(store,id);await render();toast('已刪除記錄')}return}const evtab=e.target.closest('[data-expense-view]');if(evtab){expenseView=evtab.dataset.expenseView;await render();return}if(e.target.id==='addGoodsCategoryBtn'){const input=document.getElementById('newGoodsCategory');const name=(input?.value||'').trim();if(!name){toast('先輸入種類名稱');return}const cats=await getGoodsCategories();if(cats.some(c=>c.toLowerCase()===name.toLowerCase())){toast('呢個種類已經存在');return}await saveGoodsCategories([...cats,name]);await render();toast('已新增周邊種類');return}const moveUp=e.target.closest('[data-move-category-up]');const moveDown=e.target.closest('[data-move-category-down]');if(moveUp||moveDown){const target=(moveUp||moveDown).dataset[moveUp?'moveCategoryUp':'moveCategoryDown'];const cats=await getGoodsCategories();const idx=cats.indexOf(target);const next=idx+(moveUp?-1:1);if(idx>=0&&next>=0&&next<cats.length){[cats[idx],cats[next]]=[cats[next],cats[idx]];await saveGoodsCategories(cats);await render();toast('周邊種類次序已更新')}return}const renameCat=e.target.closest('[data-rename-category]');if(renameCat){const oldName=renameCat.dataset.renameCategory;const row=renameCat.closest('[data-category-row]');if(!row)return;row.innerHTML=`<div class="field" style="flex:1;min-width:0"><label>修改種類名稱</label><input data-category-rename-input value="${esc(oldName)}" maxlength="60"></div><button class="btn" data-save-category-rename="${esc(oldName)}">儲存</button><button class="btn outline" data-cancel-category-rename>取消</button>`;row.querySelector('[data-category-rename-input]')?.focus();return}const saveRename=e.target.closest('[data-save-category-rename]');if(saveRename){const oldName=saveRename.dataset.saveCategoryRename;const row=saveRename.closest('[data-category-row]');const name=(row?.querySelector('[data-category-rename-input]')?.value||'').trim();if(!name){toast('種類名稱不可留空');return}const cats=await getGoodsCategories();if(name!==oldName&&cats.some(c=>c.toLowerCase()===name.toLowerCase())){toast('呢個種類名稱已經存在');return}await saveGoodsCategories(cats.map(c=>c===oldName?name:c));if(name!==oldName){const goods=await all('goods');for(const item of goods){if(item.category===oldName){item.category=name;await put('goods',item)}}}await render();toast(name===oldName?'名稱沒有改變':'種類名稱已更新');return}const cancelRename=e.target.closest('[data-cancel-category-rename]');if(cancelRename){await render();return}const delcat=e.target.closest('[data-delete-category]');if(delcat){const name=delcat.dataset.deleteCategory;if(confirm(`確定從可選清單移除「${name}」？舊商品記錄不會被刪除。`)){const cats=await getGoodsCategories();await saveGoodsCategories(cats.filter(c=>c!==name));await render();toast('已移除種類')}return}const th=e.target.closest('[data-theme]');if(th){setTheme(th.dataset.theme);toast('主題已更新');return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newGoodsCategory'){e.preventDefault();document.getElementById('addGoodsCategoryBtn')?.click()}});
document.addEventListener('input',async e=>{if(['goodsSearch','goodsFilter','goodsSort','goodsGroupFilter','goodsCategoryFilter'].includes(e.target.id))renderGoods(await all('goods'));if(['expenseSearch','expenseMonth','expenseGroupFilter'].includes(e.target.id)&&document.getElementById('expenseList')){const arr=(await all('expenses')).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),q=(document.getElementById('expenseSearch')?.value||'').toLowerCase(),m=document.getElementById('expenseMonth')?.value||'',gf=document.getElementById('expenseGroupFilter')?.value||'全部';document.getElementById('expenseList').innerHTML=expenseRows(arr.filter(x=>(!m||(x.date||'').startsWith(m))&&(gf==='全部'||(x.group||'')===gf)&&[x.name,x.category,x.note,x.group].join(' ').toLowerCase().includes(q)))}if(['eventSearch','eventGroupFilter','eventTypeFilter'].includes(e.target.id)){const arr=(await all('events')).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),q=(document.getElementById('eventSearch')?.value||'').toLowerCase(),gf=document.getElementById('eventGroupFilter')?.value||'全部',tf=document.getElementById('eventTypeFilter')?.value||'全部';const list=document.getElementById('eventList');if(list)list.innerHTML=eventRows(arr.filter(x=>(gf==='全部'||(x.group||'')===gf)&&(tf==='全部'||(x.eventType||'ライブ／演唱會')===tf)&&[x.name,x.group,x.eventType,(x.members||[]).join(' '),x.venue,x.seat,x.memo].join(' ').toLowerCase().includes(q)))}});
async function exportBackup(){const payload={app:'Oshi Log',version:2,exportedAt:new Date().toISOString(),goods:await all('goods'),expenses:await all('expenses'),events:await all('events'),settings:await all('settings')};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`oshi-log-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('完整備份已匯出！請妥善保存 💚')}
async function importBackup(file){try{const payload=JSON.parse(await file.text());if(!payload||!Array.isArray(payload.goods)||!Array.isArray(payload.expenses)||!Array.isArray(payload.events))throw new Error('格式不正確');if(!confirm('匯入會取代目前所有周邊、支出及參戰記錄。建議先匯出現有資料。確定繼續？'))return;for(const s of ['goods','expenses','events','settings']){if(s==='settings'&&!Array.isArray(payload.settings))continue;await new Promise((resolve,reject)=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});for(const item of payload[s])await put(s,item)}await render();toast('備份還原成功！')}catch(err){alert('無法讀取備份檔案。請確認選擇的是 Oshi Log 匯出的 JSON 檔。')}}
function setTheme(theme){const root=document.documentElement;const palettes={green:['#f5f4ed','#fffef9','#343d36','#858d82','#8da68b','#e5ecdf','#c5d4bd'],pink:['#fbf1f1','#fffafa','#493b40','#95858b','#c78f9b','#f5e0e5','#e6bfc8'],blue:['#f0f5f7','#fbfeff','#35444b','#7d8e96','#8baebd','#dceaf0','#bdd8e2'],cream:['#f7f1e5','#fffdf7','#493f31','#938675','#b49a6c','#eee2c9','#ddcba7']};const p=palettes[theme]||palettes.green;['--bg','--paper','--ink','--muted','--green','--green2','--accent'].forEach((v,i)=>root.style.setProperty(v,p[i]));document.querySelectorAll('.themechip').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme));localStorage.setItem('oshi-theme',theme)}
document.addEventListener('click',e=>{if(e.target.id==='exportBtn')exportBackup()});document.addEventListener('change',async e=>{if(e.target.id==='importFile'&&e.target.files[0])importBackup(e.target.files[0]);if(e.target.id==='pieCurrency')renderExpenseAnalytics(await all('expenses'),await all('goods'));if(['yearA','yearB','yearCurrency'].includes(e.target.id))renderYearComparison(await all('expenses'),await all('goods'));if(['goodsFilter','goodsGroupFilter','goodsCategoryFilter','goodsSort'].includes(e.target.id))renderGoods(await all('goods'))});
(async()=>{try{await openDB();setTheme(localStorage.getItem('oshi-theme')||'green');await render()}catch(e){document.getElementById('page').innerHTML=empty('⚠️','無法啟動本機資料庫','請使用較新的 Safari 或 Chrome 開啟此原型。')}})();

</script></body></html>
